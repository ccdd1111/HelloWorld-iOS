name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Create Project Files Automatically
      run: |
        mkdir -p Sources
        cat > Sources/main.swift << 'SWIFTEOF'
        import SwiftUI

        @main
        struct HelloWorldApp: App {
            var body: some Scene {
                WindowGroup {
                    Text("Hello World")
                        .font(.largeTitle)
                        .foregroundColor(.blue)
                        .padding()
                }
            }
        }
        SWIFTEOF
        
        cat > project.yml << 'YAMLEOF'
        name: HelloWorld
        options:
          bundleIdPrefix: com.example
          deploymentTarget:
            iOS: "16.7"
        targets:
          HelloWorld:
            type: application
            platform: iOS
            sources:
              - Sources
            settings:
              PRODUCT_BUNDLE_IDENTIFIER: com.example.helloworld
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
              SWIFT_VERSION: "5.0"
              GENERATE_INFOPLIST_FILE: YES
        YAMLEOF
      
    - name: Install xcodegen
      run: brew install xcodegen
      
    - name: Generate Xcode Project
      run: xcodegen generate
      
    - name: Build Unsigned App
      run: |
        xcodebuild -project HelloWorld.xcodeproj \
                   -scheme HelloWorld \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath derived \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build
                   
    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -R derived/Build/Products/Release-iphoneos/HelloWorld.app Payload/
        zip -r HelloWorld_Unsigned.ipa Payload
        rm -rf Payload
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: HelloWorld-IPA
        path: HelloWorld_Unsigned.ipa
