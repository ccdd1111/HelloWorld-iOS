name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Create project files with Python
      run: |
        python3 << 'PYEOF'
        import os
        os.makedirs('Sources', exist_ok=True)
        
        swift_code = '''import SwiftUI

@main
struct HelloWorldApp: App {
    var body: some Scene {
        WindowGroup {
            Text("Hello World")
                .font(.largeTitle)
                .foregroundColor(.blue)
                .padding()
        }
    }
}
'''
        with open('Sources/main.swift', 'w') as f:
            f.write(swift_code)
        
        project_yml = '''name: HelloWorld
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.7"
targets:
  HelloWorld:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.helloworld
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      SWIFT_VERSION: "5.0"
      GENERATE_INFOPLIST_FILE: YES
'''
        with open('project.yml', 'w') as f:
            f.write(project_yml)
        PYEOF
      
    - run: brew install xcodegen
      
    - run: xcodegen generate
      
    - run: |
        xcodebuild -project HelloWorld.xcodeproj \
                   -scheme HelloWorld \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath derived \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build
                   
    - run: |
        mkdir -p Payload
        cp -R derived/Build/Products/Release-iphoneos/HelloWorld.app Payload/
        zip -r HelloWorld_Unsigned.ipa Payload
        rm -rf Payload
        
    - uses: actions/upload-artifact@v4
      with:
        name: HelloWorld-IPA
        path: HelloWorld_Unsigned.ipa
